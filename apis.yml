name: Bykea
description: >-
  Bykea is a Karachi-based Pakistani mobility and logistics super-app that
  offers app-hailed motorbike rides, on-demand parcel and food delivery, cash
  pickup and drop-off, and digital payments across major Pakistani cities. It
  connects a large network of motorbike captains with riders and merchants,
  positioning itself as a low-cost transport, last-mile logistics, and financial
  services platform for the mass market. Backed by Prosus Ventures (Naspers),
  Bykea was added to the API Evangelist network as a mobility-sector portfolio
  lead; this profile has been enriched with the provider's public security
  surface (a live RFC 9116 security.txt and a HackerOne bug bounty program) and
  domain-security posture. No public developer portal, OpenAPI, or partner API
  documentation is exposed - the primary web surface sits behind Cloudflare bot
  protection.
